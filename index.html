<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINTU TV - অটো সুন্দর কার্টুন</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;font-family:sans-serif;text-align:center;overflow:hidden}
.tv{width:100%;height:100vh;background:#2d3436;padding:8px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;padding:5px}
.live{background:#ff4757;color:#fff;padding:5px 12px;border-radius:20px;font-weight:900;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.ch{background:linear-gradient(90deg,#e84393,#fdcb6e);color:#fff;padding:5px 14px;border-radius:20px;font-weight:900}
.stage{flex:1;background:linear-gradient(180deg,#7EC8FF 0%,#A8E6CF 55%,#7ED957 55%,#5CB85C 100%);border-radius:22px;position:relative;overflow:hidden}
.sun{position:absolute;top:14px;right:20px;width:65px;height:65px;background:#FFD93D;border-radius:50%;box-shadow:0 0 30px #FFD93D;display:flex;align-items:center;justify-content:center;font-size:28px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;background:#fff;border-radius:50px;padding:6px 16px;animation:float 4s infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.c1{top:20px;left:30px}.c2{top:50px;left:280px}
.house{position:absolute;bottom:95px;width:115px;height:88px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#fff;box-shadow:0 6px 12px rgba(0,0,0,.2)}
.h1{left:12px;background:#FF6B6B}.h2{right:12px;background:#4D96FF}
.school{left:140px;background:#FFD93D;color:#2d3436}.mosque{right:140px;background:#00b894}
.tree{position:absolute;bottom:90px;font-size:42px}.t1{left:285px}.t2{right:285px}
.pond{position:absolute;bottom:88px;right:250px;background:#74b9ff;width:82px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
/* মিন্টু সুন্দর ডিজাইন */
.mintu{position:absolute;bottom:42px;left:175px;width:115px;z-index:5;animation:bounce 1.1s infinite}
@keyframes bounce{50%{transform:translateY(-7px)}}
.mintu.dance{animation:dance .45s infinite}
@keyframes dance{0%{transform:rotate(-9deg)}50%{transform:rotate(9deg) translateY(-16px)}100%{transform:rotate(-9deg)}}
.cap{width:92px;height:48px;background:linear-gradient(90deg,#FFD93D,#FF6B6B);border-radius:60px 60px 12px 12px;margin:0 auto;border:3px solid #2d3436;display:flex;align-items:center;justify-content:center;font-size:20px}
.face{width:98px;height:88px;background:#FFE3C2;border:3px solid #2d3436;border-radius:50%;margin:-4px auto 0;position:relative}
.eye{position:absolute;top:24px;width:26px;height:28px;background:#fff;border:2.5px solid #2d3436;border-radius:50%;display:flex;align-items:center;justify-content:center}
.eye::after{content:"";width:15px;height:15px;background:#2d3436;border-radius:50%;box-shadow:inset 4px 4px 0 #fff}
.e1{left:13px}.e2{right:13px}
.cheek{position:absolute;top:50px;width:17px;height:12px;background:#FFADAD;border-radius:50%}
.k1{left:4px}.k2{right:4px}
.mouth{position:absolute;top:54px;left:36px;width:27px;height:16px;background:#2d3436;border-radius:0 0 20px 20px}
.mouth.talk{animation:talk .25s infinite}
@keyframes talk{50%{height:24px}}
.body{width:88px;height:68px;background:linear-gradient(180deg,#FFD93D,#FFB703);border:3px solid #2d3436;border-radius:16px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:30px}
.pant{width:76px;height:32px;background:#4D96FF;border:3px solid #2d3436;border-top:none;margin:0 auto;border-radius:0 0 12px 12px}
.leg{display:flex;justify-content:center;gap:8px}
.shoe{width:30px;height:19px;background:#2d3436;border-radius:12px 12px 6px 6px}
/* ভুতুম */
.vutum{position:absolute;bottom:165px;right:260px;width:92px;animation:float 2.2s infinite;z-index:4}
.v-body{width:92px;height:98px;background:#fff;border:3px solid #2d3436;border-radius:55px 55px 22px 22px;position:relative}
.v-body::after{content:"";position:absolute;bottom:-10px;left:0;width:100%;height:22px;background:#fff;clip-path:polygon(0 0,15% 100%,30% 0,45% 100%,60% 0,75% 100%,90% 0,100% 100%,100% 0)}
.v-eye{position:absolute;top:30px;width:21px;height:25px;background:#fff;border:2.5px solid #2d3436;border-radius:50%;display:flex;align-items:center;justify-content:center}
.v-eye::after{content:"";width:12px;height:12px;background:#2d3436;border-radius:50%}
.ve1{left:18px}.ve2{right:18px}
.v-cheek{position:absolute;top:54px;width:15px;height:11px;background:#FFADAD;border-radius:50%}
.vk1{left:8px}.vk2{right:8px}
.v-mouth{position:absolute;top:56px;left:33px;width:25px;height:15px;background:#2d3436;border-radius:0 0 16px 16px}
/* পশু */
.animal{position:absolute;bottom:48px;width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;border:3px solid #2d3436;box-shadow:0 5px 0 rgba(0,0,0,.2);animation:float 3s infinite}
.animal.jump{animation:jump .4s infinite}
@keyframes jump{50%{transform:translateY(-15px) scale(1.15)}}
.cow{left:12px;background:#FFE8D6}.dog{left:375px;background:#FFF3CD}.cat{left:480px;background:#FDE2E2}.bird{top:82px;right:85px;background:#D6F0FF}.goat{right:12px;background:#E2F5D6}
#lyrics{color:#fdcb6e;font-size:16px;font-weight:900;padding:5px}
#bottom{color:#fff;font-size:14px;font-weight:bold;padding:4px}
.tap{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:24px;font-weight:900;z-index:99;cursor:pointer;padding:20px}
.tap span{font-size:15px;margin-top:12px;color:#fdcb6e}
</style>
</head>
<body>
<div class="tap" id="tap" onclick="startTV()">📺<br>MINTU TV চালাতে<br>একবার টাচ করো!<span>তারপর এমনি কার্টুন চলবে! বাটন চাপতে হবে না!</span></div>
<div class="tv">
<div class="top"><div class="live">🔴 LIVE</div><div class="ch">📺 MINTU TV</div></div>
<div class="stage">
<div class="sun">🌞</div><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div>
<div class="house h1">🏠<span>বাড়ি</span></div><div class="house school">🏫<span>পাঠশালা</span></div><div class="house mosque">🕌<span>মসজিদ</span></div><div class="house h2">🏠<span>বাড়ি</span></div>
<div class="tree t1">🌳</div><div class="tree t2">🌳</div><div class="pond">🌸</div>
<div class="mintu" id="mintu"><div class="cap">⭐ ⭐</div><div class="face"><div class="eye e1"></div><div class="eye e2"></div><div class="cheek k1"></div><div class="cheek k2"></div><div class="mouth" id="mouth"></div></div><div class="body">⭐</div><div class="pant"></div><div class="leg"><div class="shoe"></div><div class="shoe"></div></div><div style="background:#fff;padding:2px 10px;border-radius:20px;font-weight:900;font-size:12px;display:inline-block">MINTU</div></div>
<div class="vutum"><div class="v-body"><div class="v-eye ve1"></div><div class="v-eye ve2"></div><div class="v-cheek vk1"></div><div class="v-cheek vk2"></div><div class="v-mouth"></div></div><div style="font-weight:900;background:#fff;border-radius:12px;margin-top:9px;padding:2px">ভুতুম</div></div>
<div class="animal cow" id="a-cow">🐄</div><div class="animal dog" id="a-dog">🐶</div><div class="animal cat" id="a-cat">🐱</div><div class="animal bird" id="a-bird">🐦</div><div class="animal goat" id="a-goat">🐐</div>
</div>
<div id="lyrics">🎶 মিন্টু আর ভুতুম - টিভির কার্টুন!</div>
<div id="bottom">📺 টিভি চলছে... এমনি কার্টুন চলবে...</div>
</div>
<script>
let started=false;
function speak(t){return new Promise(res=>{try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';u.pitch=1.4;u.rate=0.95;u.onstart=()=>document.getElementById('mouth').classList.add('talk');u.onend=()=>{document.getElementById('mouth').classList.remove('talk');res();};speechSynthesis.speak(u);setTimeout(res,4200);}catch(e){res();}});}
function playBaddi(){try{let ac=new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<10;i++){let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=110;o.type='sine';g.gain.value=0.35;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*0.35);o.stop(ac.currentTime+i*0.35+0.15);}for(let i=0;i<14;i++){let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=750+i*40;o.type='triangle';g.gain.value=0.1;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*0.2);o.stop(ac.currentTime+i*0.2+0.08);}let notes=[523,659,784,1046,784,659];notes.forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='sine';g.gain.value=0.15;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*0.32);o.stop(ac.currentTime+i*0.32+0.28);});}catch(e){}}
function jump(id){let el=document.getElementById(id);if(el){el.classList.add('jump');setTimeout(()=>el.classList.remove('jump'),2000);}}
async function startTV(){
if(started)return;started=true;document.getElementById('tap').style.display='none';
while(true){
playBaddi();
document.getElementById('lyrics').innerText="🎶 মিন্টু আর ভুতুম, মিন্টু আর ভুতুম! মজার মজার কার্টুন!";
document.getElementById('bottom').innerText="🥁 ঢোল বাজছে! তবলা বাজছে! মিন্টু নাচছে!";
document.getElementById('mintu').classList.add('dance');
await speak('মিন্টু আর ভুতুম! মিন্টু আর ভুতুম! মজার মজার কার্টুন! আমরা সবাই বন্ধু!');
document.getElementById('mintu').classList.remove('dance');
await new Promise(r=>setTimeout(r,400));
document.getElementById('lyrics').innerText="🌾 গল্প: মিন্টু মাঠে গেলো! গরু হারিয়ে গেলো!";
document.getElementById('bottom').innerText="😱 মিন্টু: আরে! গরু কোথায় গেলো?";
await speak('আজ মিন্টু মাঠে গেলো! গরু হারিয়ে গেলো! মিন্টু বললো, গরু কোথায় গেলো?');
playBaddi();
document.getElementById('lyrics').innerText="🐄 গরু: হাম্বা! হাম্বা!";
jump('a-cow');await speak('গরু ডাকে হাম্বা হাম্বা! হাম্বা!');
document.getElementById('lyrics').innerText="🐶 ঘেউ! 🐱 মিউ! 🐦 কিচির! 🐐 ম্যা!";
jump('a-dog');jump('a-cat');jump('a-bird');jump('a-goat');
await speak('কুকুর ডাকে ঘেউ ঘেউ! বিড়াল ডাকে মিউ মিউ! পাখি ডাকে কিচির মিচির! ছাগল ডাকে ম্যা ম্যা!');
document.getElementById('lyrics').innerText="🎉 মিন্টু গরুকে পেলো! সবাই খুশি! সবাই নাচছে!";
document.getElementById('bottom').innerText="💃 সবাই নাচছে! তুমিও নাচো!";
document.getElementById('mintu').classList.add('dance');playBaddi();
await speak('মিন্টু গরুকে খুঁজে পেলো! সবাই খুশি! সবাই নাচছে!');
document.getElementById('mintu').classList.remove('dance');
document.getElementById('lyrics').innerText="❤️ ভালো কথা: বড়দের কথা শুনবে! পশুকে ভালোবাসবে!";
document.getElementById('bottom').innerText="🎬 পর্ব শেষ! আবার চলবে...";
await speak('বন্ধুরা, ভালো করে পড়বে! বড়দের কথা শুনবে! পশু পাখিকে ভালোবাসবে! আগামী পর্বে আবার দেখা হবে!');
await new Promise(r=>setTimeout(r,1000));
}}
</script>
</body>
  </html>
